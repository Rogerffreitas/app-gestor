name: ⚡️ EAS Update (Preview)

on:
    pull_request:
        branches: [main]

jobs:
    test:
        name: 🧪 Run Tests
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🧪 Run tests
              run: npm test

    publish-update:
        name: 🚀 Publish EAS Update
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            # Mantido por segurança, pois o EAS CLI também valida o app.json internamente
            - name: 🔗 Fix Node Path for Child Processes
              run: |
                  sudo rm -f /usr/bin/node
                  sudo cp $(which node) /usr/bin/node
                  sudo chmod +x /usr/bin/node

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🛠️ Install EAS CLI globally
              run: npm install -g eas-cli

            - name: ⚡️ Deploy EAS Update to Preview
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: eas update --platform=android --channel=preview --non-interactive
