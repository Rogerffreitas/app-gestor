name: Build or update preview version

on:
    pull_request:
        branches: [main]

jobs:
    test:
        name: 🧪 Run Tests
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🧪 Run tests
              run: npm test

    eas-preview:
        name: 🚀 EAS Preview (Android)
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: 🔗 Fix Node Path for Child Processes
              run: sudo ln -sf $(which node) /usr/local/bin/node

            - name: 📦 Install dependencies
              run: npm ci

            # 🔥 CORREÇÃO: Instala o EAS CLI globalmente para evitar falhas de escopo do npx
            - name: 🛠️ Install EAS CLI globally
              run: npm install -g eas-cli

            - name: 🔍 Check Fingerprint & Existing Builds
              id: fingerprint
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  # 1. Gera o fingerprint usando o pacote local
                  ANDROID_HASH=$(npx @expo/fingerprint android | jq -r '.hash')

                  if [ -z "$ANDROID_HASH" ] || [ "$ANDROID_HASH" = "null" ]; then
                    echo "❌ Erro ao gerar o hash do Fingerprint."
                    exit 1
                  fi

                  echo "Fingerprint Hash limpo: $ANDROID_HASH"

                  # 2. Consulta o EAS usando o comando global 'eas' direto
                  BUILD_LIST_JSON=$(eas build:list --platform=android --profile=preview --fingerprint=$ANDROID_HASH --json --non-interactive)

                  # Garante que, se o comando falhar ou voltar vazio, o COUNT seja 0 em vez de quebrar a expressão matemática
                  BUILD_COUNT=$(echo "$BUILD_LIST_JSON" | jq 'length' 2>/dev/null || echo "0")

                  echo "Quantidade de builds encontrados: $BUILD_COUNT"

                  if [ "$BUILD_COUNT" -gt 0 ]; then
                    echo "build_exists=true" >> $GITHUB_OUTPUT
                    echo "Build correspondente encontrado no EAS."
                  else
                    echo "build_exists=false" >> $GITHUB_OUTPUT
                    echo "Nenhum build correspondente encontrado. Um novo build será gerado."
                  fi

            - name: ⚡️ Publish EAS Update (Se o build já existir)
              if: steps.fingerprint.outputs.build_exists == 'true'
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: eas update --platform=android --channel=preview --non-interactive

            - name: 🛠 Trigger EAS Build (Se não existir build com esse fingerprint)
              if: steps.fingerprint.outputs.build_exists == 'false'
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: eas build --platform=android --profile=preview --non-interactive --no-wait
