name: Build or update preview version

on:
    pull_request:
        branches: [main]

jobs:
    # 1. Job de Testes
    test:
        name: 🧪 Run Tests
        runs-on: ubuntu-latest
        steps:
            - name: 🏗 Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: 📦 Install dependencies
              run: npm ci

            - name: 🧪 Run tests
              run: npm test

    # 2. Job do EAS
    name: Build or update preview version

      fingerprint: #calculate fingerprint
        environment: preview
        type: fingerprint

      android_get_build: # if there's a matching build...
       needs: [fingerprint]
        type: get-build
        params:
          fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
          platform: android
          profile: preview

      android_update: # publish an update to that build
        needs: [android_get_build]
        if: ${{ needs.android_get_build.outputs.build_id }}
        type: update
        params:
         channel: preview
         platform: android

      android_build: # otherwise make a new build
        needs: [android_get_build]
        if: ${{ !needs.android_get_build.outputs.build_id }}
        type: build
        params:
          platform: android
          profile: preview
    